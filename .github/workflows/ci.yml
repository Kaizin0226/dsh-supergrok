name: offline-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - name: Verify reproducible preset derivation
        run: node scripts/derive-grok-preset.mjs --check
      - name: Pack native plugins and locked official runtime
        shell: pwsh
        run: node scripts/build-suite.mjs --work-dir "$env:RUNNER_TEMP/dsh-supergrok-native"
      - name: Review current dependency advisories
        shell: pwsh
        run: |
          npm audit --audit-level=low
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm audit --omit=dev --audit-level=low
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm audit --prefix "$env:RUNNER_TEMP/dsh-supergrok-native/bundle" --audit-level=low
          exit $LASTEXITCODE
      - name: Install isolated test browser
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/dsh-supergrok-native/browsers
        run: node node_modules/playwright/cli.js install chromium
      - name: Verify native Web and headless compositions and rollback
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/dsh-supergrok-native/browsers
        shell: pwsh
        run: node scripts/test-installed.mjs --work-dir "$env:RUNNER_TEMP/dsh-supergrok-native"
