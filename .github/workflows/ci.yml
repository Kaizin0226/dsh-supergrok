name: offline-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - name: Build pinned DSH core from clean source
        shell: pwsh
        run: node scripts/build-dsh.mjs --work-dir "$env:RUNNER_TEMP/dsh-supergrok-build"
      - name: Test core input preparation and lifecycle
        shell: pwsh
        run: node scripts/build-dsh.mjs --work-dir "$env:RUNNER_TEMP/dsh-supergrok-build" --phase test
      - name: Build and test extensions and locked distribution
        shell: pwsh
        run: node scripts/build-suite.mjs --work-dir "$env:RUNNER_TEMP/dsh-supergrok-build"
      - name: Verify installed web and headless compositions and rollback
        shell: pwsh
        run: node scripts/test-installed.mjs --work-dir "$env:RUNNER_TEMP/dsh-supergrok-build"
